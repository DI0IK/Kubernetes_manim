apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
spec:
  template:
    spec:
      containers:
      - image: cluster-autoscaler:v1.30
        command:
        - ./cluster-autoscaler
        - --nodes=1:10:default-worker-asg
        - --scale-down-enabled=true